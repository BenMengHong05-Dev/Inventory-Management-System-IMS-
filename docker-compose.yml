services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory_system_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
    networks:
      - inventory_network

networks:
  inventory_network:
    driver: bridge
